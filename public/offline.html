<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7959ac">
<title>Connected · Offline</title>
<style>
  :root { color-scheme: light; --ink: #2d2238; --muted: #6f6479; --brand: #7959ac; --bg: #fffdfb; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); }
  main { max-width: 340px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 24px; margin: 20px 0 8px; letter-spacing: -0.5px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 999px;
           padding: 12px 24px; min-height: 44px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You’re offline</h1>
  <p>Connected needs a connection to show who’s nearby. Your profile and requests are safe; nothing is stored on this device.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
